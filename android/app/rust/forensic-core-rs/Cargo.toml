[package]
name = "forensic-core-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native logcat parser and crash classifier for Causentry"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
