[package]
name = "backup-core-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native configuration backup inspector and merger for Causentry"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
jni = "0.21"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
