[package]
name = "causentry-fuse-core"
version = "3.1.0"
edition = "2024"
description = "Memory-safe Rust Unicode 12.1, path canonicalization, ELF/ZIP/XZ binary parser, and FUSE dirent/direntplus payload filter for FuseHide"
license = "Apache-2.0"

[lib]
name = "causentry_fuse_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
