[target.aarch64-linux-android]
linker = "tools/sdk/ndk/26.1.10909125/toolchains/llvm/prebuilt/windows-x86_64/bin/clang.exe"
ar = "tools/sdk/ndk/26.1.10909125/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
rustflags = [
    "-C", "link-arg=--target=aarch64-linux-android26",
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
    "-C", "link-arg=-Wl,--gc-sections",
]

[target.armv7-linux-androideabi]
linker = "tools/sdk/ndk/26.1.10909125/toolchains/llvm/prebuilt/windows-x86_64/bin/clang.exe"
ar = "tools/sdk/ndk/26.1.10909125/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
rustflags = [
    "-C", "link-arg=--target=armv7a-linux-androideabi26",
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
    "-C", "link-arg=-Wl,--gc-sections",
]
